server:
  host: "0.0.0.0"
  port: 8080
  read_timeout: 30s
  write_timeout: 30s

database:
  host: "localhost"
  port: 5432
  user: "joblinker"
  password: "joblinker_dev_password"
  name: "joblinker"
  sslmode: "disable"
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: 5m

redis:
  host: "localhost"
  port: 6379
  password: ""
  db: 0

rabbitmq:
  host: "localhost"
  port: 5672
  user: "joblinker"
  password: "joblinker_dev"
  vhost: "/"

chroma:
  host: "localhost"
  port: 8000

jwt:
  secret: "${JWT_SECRET}"
  expiry: 24h
  refresh_expiry: 168h

encryption:
  key: "${ENCRYPTION_KEY}"

logging:
  level: "INFO"
  format: "json"
