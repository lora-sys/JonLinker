syntax = "proto3";

option go_package = "joblinker/pkg/proto";
option java_multiple_files = true;
option java_package = "com.joblinker.proto";

package joblinker;

// AgentRole represents the type of agent in the A2A recruitment system
enum AgentRole {
  AGENT_ROLE_UNSPECIFIED = 0;
  SEEKER = 1;
  RECRUITER = 2;
}

// AgentState represents the current state of an agent in the FSM
enum AgentState {
  AGENT_STATE_UNSPECIFIED = 0;
  IDLE = 1;
  SEARCHING = 2;
  NEGOTIATING = 3;
  INTERVIEWING = 4;
  OFFER_RECEIVED = 5;
  HIRED = 6;
  REJECTED = 7;
}

// TaskPriority for RabbitMQ queue tasks
enum TaskPriority {
  TASK_PRIORITY_UNSPECIFIED = 0;
  LOW = 1;
  NORMAL = 2;
  HIGH = 3;
  CRITICAL = 4;
}

// InterviewFormat for interview invitations
enum InterviewFormat {
  INTERVIEW_FORMAT_UNSPECIFIED = 0;
  VIDEO = 1;
  PHONE = 2;
  ONSITE = 3;
}

// InterviewStatus for interview state tracking
enum InterviewStatus {
  INTERVIEW_STATUS_UNSPECIFIED = 0;
  PENDING = 1;
  CONFIRMED = 2;
  CANCELLED = 3;
  COMPLETED = 4;
}

// OfferStatus for offer lifecycle
enum OfferStatus {
  OFFER_STATUS_UNSPECIFIED = 0;
  PENDING_ACCEPTANCE = 1;
  ACCEPTED = 2;
  DECLINED = 3;
  EXPIRED = 4;
}

// MessageType for WebSocket frame dispatching
enum MessageType {
  MESSAGE_TYPE_UNSPECIFIED = 0;
  TEXT = 1;
  TOOL_CALL = 2;
  TOOL_RESULT = 3;
  STATE_CHANGE = 4;
  MEMORY_UPDATE = 5;
  HEARTBEAT = 6;
  ERROR = 7;
}

// TextMessage is the core conversation unit between agents
message TextMessage {
  string id = 1;
  AgentRole role = 2;
  string content = 3;
  string intent_type = 4;
  int64 timestamp = 5;
  string cache_key = 6;
}

// ToolCall represents a function invocation request
message ToolCall {
  string call_id = 1;
  string tool_name = 2;
  bytes arguments = 3;
  string cache_key = 4;
}

// ToolResult represents the result of a tool execution
message ToolResult {
  string call_id = 1;
  bool success = 2;
  bytes payload = 3;
  string cache_key = 4;
  string summary = 5;
  string error_message = 6;
}

// StateChangeEvent notifies subscribers of FSM transitions
message StateChangeEvent {
  string match_id = 1;
  AgentState old_state = 2;
  AgentState new_state = 3;
  string reason = 4;
  int64 timestamp = 5;
}

// MemoryUpdate notifies of vector memory changes
message MemoryUpdate {
  string memory_id = 1;
  string memory_type = 2;
  string user_id = 3;
  string content = 4;
  repeated double embedding = 5;
  int64 timestamp = 6;
}

// JobDetail describes a job posting
message JobDetail {
  string job_id = 1;
  string title = 2;
  string description = 3;
  int64 salary_min = 4;
  int64 salary_max = 5;
  string currency = 6;
  string location = 7;
  repeated string skills = 8;
  int32 experience_years_min = 9;
  int32 experience_years_max = 10;
  int64 posted_at = 11;
  string status = 12;
}

// ResumeDetail describes a candidate resume
message ResumeDetail {
  string resume_id = 1;
  string candidate_name = 2;
  string email = 3;
  string phone = 4;
  repeated string skills = 5;
  int32 experience_years = 6;
  int64 salary_expectation_min = 7;
  int64 salary_expectation_max = 8;
  string location_preference = 9;
  string summary = 10;
  int64 uploaded_at = 11;
}

// InterviewInvitation is a scheduled interview
message InterviewInvitation {
  string interview_id = 1;
  string match_id = 2;
  int64 scheduled_at = 3;
  int32 duration_minutes = 4;
  InterviewFormat format = 5;
  string location_or_url = 6;
  InterviewStatus status = 7;
  string notes = 8;
}

// OfferDetail is a job offer
message OfferDetail {
  string offer_id = 1;
  string match_id = 2;
  int64 salary_amount = 3;
  string currency = 4;
  int64 start_date = 5;
  repeated string benefits = 6;
  int64 expires_at = 7;
  OfferStatus status = 8;
  string terms = 9;
}

// QueueTask is a RabbitMQ task envelope
message QueueTask {
  string task_id = 1;
  string task_type = 2;
  TaskPriority priority = 3;
  bytes payload = 4;
  uint32 retry_count = 5;
  uint32 max_retries = 6;
  int64 created_at = 7;
  int64 scheduled_at = 8;
  uint32 schema_version = 9;
}

// WebSocketFrame is the transport envelope for all WebSocket messages
message WebSocketFrame {
  MessageType message_type = 1;
  bytes payload = 2;
  uint64 sequence_num = 3;
  int64 timestamp = 4;
  string cache_key = 5;
  string correlation_id = 6;
  uint32 schema_version = 7;
}
